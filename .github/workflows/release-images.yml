name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released version
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image metadata
        id: app
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: type=raw,value=${{ github.event.release.tag_name }}

      - name: Build and publish the app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.app.outputs.tags }}
          labels: ${{ steps.app.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Tools image metadata
        id: tools
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}-tools
          flavor: latest=false
          tags: type=raw,value=${{ steps.app.outputs.version }}

      - name: Build and publish migrations and provisioning tools
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.tools.outputs.tags }}
          labels: ${{ steps.tools.outputs.labels }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools

      - name: Database image metadata
        id: database
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}-db
          flavor: latest=false
          tags: type=raw,value=${{ steps.app.outputs.version }}

      - name: Build and publish the initialized database image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: database
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.database.outputs.tags }}
          labels: ${{ steps.database.outputs.labels }}
          cache-from: type=gha,scope=database
          cache-to: type=gha,mode=max,scope=database

      - name: Promote the latest stable release
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.app.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          latest_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          if [ "$latest_release" != "$RELEASE_TAG" ]; then
            echo "Versioned images published; this release is not GitHub's latest stable release."
            exit 0
          fi
          for image in "$IMAGE" "$IMAGE-tools" "$IMAGE-db"; do
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          done
