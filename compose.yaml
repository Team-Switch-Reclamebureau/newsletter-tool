services:
  db:
    build:
      context: .
      target: database
    environment:
      POSTGRES_DB: postroom
      POSTGRES_USER: postroom_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTROOM_DB_PASSWORD: ${POSTROOM_DB_PASSWORD:?Set POSTROOM_DB_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTROOM_DB_PASSWORD\" psql -h 127.0.0.1 -U postroom_app -d \"$$POSTGRES_DB\" -Atqc 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: tools
    environment: &app_environment
      DATABASE_URL: postgresql://postroom_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/postroom
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      ORIGIN: ${APP_ORIGIN}
      UPLOAD_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    environment:
      <<: *app_environment
      DATABASE_URL: postgresql://postroom_app:${POSTROOM_DB_PASSWORD:?Set POSTROOM_DB_PASSWORD}@db:5432/postroom
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  database:
  uploads:
  caddy_data:
  caddy_config:
